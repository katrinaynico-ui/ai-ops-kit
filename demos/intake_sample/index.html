<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DEMO — AI Intake → Sheet (SAMPLE)</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;background:#f8fafc;color:#0f172a}.banner{background:#fef3c7;border:1px solid #f59e0b;padding:.75rem;border-radius:8px}label{display:block;font-weight:600;margin:.75rem 0 .25rem}input,textarea,select{width:100%;padding:.6rem;box-sizing:border-box}button{margin-top:1rem;padding:.7rem;background:#0f766e;color:#fff;border:0;border-radius:8px}</style></head>
<body><div class="banner"><strong>DEMO / SAMPLE</strong> — Not a live client system. No real customer data.</div><h1>Lead intake → normalized row → alert</h1><p>Simulates form → sheet row → notification text. Runs 100% in-browser.</p><label>Name</label><input id="name" placeholder="Alex Rivera"><label>Company</label><input id="company" placeholder="Acme SMB"><label>Email</label><input id="email" type="email"><label>Main pain</label><textarea id="pain"></textarea><button onclick="capture()">Capture lead (demo)</button><div id="alert"></div><script>function capture(){document.getElementById('alert').textContent='ALERT (demo): New lead '+(document.getElementById('name').value||'—')}</script></body></html>
