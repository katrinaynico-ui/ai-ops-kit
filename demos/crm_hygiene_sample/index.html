<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DEMO — CRM Hygiene Checklist (SAMPLE)</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;background:#f8fafc;color:#0f172a}.banner{background:#fef3c7;border:1px solid #f59e0b;padding:.75rem;border-radius:8px}label{display:block;background:#fff;border:1px solid #e2e8f0;padding:.7rem;margin:.4rem 0;border-radius:8px}</style></head><body><div class="banner"><strong>DEMO / SAMPLE</strong> — Not a live CRM. Portfolio checklist only.</div><h1>CRM hygiene sprint (7 checks)</h1><p>Progress: <span id="pct">0</span>%</p><div id="list"></div><p id="done" style="display:none">SAMPLE sprint complete</p><script>const items=['Dedupe emails','Normalize lifecycle stages','Archive dead deals >90 days','Fix missing owners','Tag source on last 50 leads','Disable broken workflow','One pipeline dashboard'];const list=document.getElementById('list');items.forEach(t=>{const l=document.createElement('label');l.innerHTML='<input type="checkbox"> '+t;list.appendChild(l)});list.addEventListener('change',()=>{const n=list.querySelectorAll('input:checked').length;document.getElementById('pct').textContent=Math.round(n/7*100);document.getElementById('done').style.display=n===7?'block':'none'})</script></body></html>
